launch-templates:
  linux-medium-bun:
    resource-class: docker_linux_amd64/medium
    image: ubuntu22.04-node20.11-v9
    env:
      CI: 'true'
      NX_DAEMON: 'false'
    init-steps:
      - name: Checkout
        uses: nrwl/nx-cloud-workflows/v5/workflow-steps/checkout/main.yaml
      - name: Install Node.js 24
        uses: nrwl/nx-cloud-workflows/v5/workflow-steps/install-node/main.yaml
        inputs:
          node_version: '24'
      - name: Install Bun 1.1.30
        script: |
          set -eu
          # npm extracts the platform binary without requiring system unzip.
          npm install --global --prefix "$HOME/.bun" bun@1.1.30
          export PATH="$HOME/.bun/bin:$PATH"
          echo "PATH=$HOME/.bun/bin:$PATH" >> "$NX_CLOUD_ENV"
          bun --version
      - name: Install dependencies
        script: bun install --frozen-lockfile