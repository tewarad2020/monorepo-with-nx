name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      NX_DAEMON: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          # Match the Bun version used to generate bun.lockb.
          bun-version: '1.1.30'

      # Run tasks on this runner until Nx Agents have Go and Bun configured.
      # The current linux-medium-js template is not a mixed Go/Bun environment.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/backend/go.mod
          # This module currently uses only the standard library (no go.sum).
          cache: false

      - name: Install dependencies
        id: install
        run: bun install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: main

      # Backend has no Nx test/build targets yet, so check it explicitly.
      - name: Test backend
        working-directory: apps/backend
        run: go test -race -count=1 ./...

      - name: Vet and build backend
        working-directory: apps/backend
        run: |
          go vet ./...
          go build -o "$RUNNER_TEMP/todo-backend" .

      # No lint target is configured. Vitest disables watch mode in CI.
      # Use test, not the Cloud-only atomized test-ci target, on this runner.
      - name: Check affected frontend projects
        run: bun x nx affected -t typecheck test build

      - name: Nx Cloud self-healing
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun x nx fix-ci
