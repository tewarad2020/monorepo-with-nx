services:
  webhook-proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - jenkins

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --protocol http2 --url http://webhook-proxy:8080
    restart: unless-stopped
    depends_on:
      - webhook-proxy
    networks:
      - jenkins

networks:
  jenkins:
    external: true
    name: jenkins-ci